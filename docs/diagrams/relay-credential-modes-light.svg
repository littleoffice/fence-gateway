<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 396" role="img" aria-label="Three ways the gateway authenticates to the relay. Static: the relay sees only the gateway, and callers' tokens do not work at the relay. Passthrough: the relay sees each caller, but their tokens also work at the relay directly. Exchange: the gateway swaps each caller's token at the identity provider for a relay token, so the relay sees each caller and their own tokens do not work there."><style>
.bg{fill:#ffffff}
.box{fill:#ffffff;stroke:#c3ccd5;stroke-width:1.5}
.box.gw{stroke:#0b6b78;stroke-width:2;fill:#e2f1f3}
.box.idp{stroke:#9a5b07;fill:#fbf0df}
.pill{fill:#ffffff;stroke:#9a5b07;stroke-width:1.2}
.zone{fill:#eef2f5;stroke:#5b6875;stroke-width:1.2;stroke-dasharray:6 5}
.t{fill:#17212b;font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
.lbl{font-size:14px;font-weight:600}
.m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sub,.tok,.zone-t{fill:#5b6875;font-size:11px}
.pill-t{fill:#17212b;font-size:11px;font-weight:500}
.pill-s{fill:#5b6875;font-size:10px}
.head{fill:#17212b;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;font-weight:600}
.head-s{fill:#5b6875;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.head-s.rec{fill:#0b6b78}
.ln{stroke:#17212b;stroke-width:1.5;fill:none}
.ln.acc{stroke:#0b6b78;stroke-width:2}
.idpln{stroke:#9a5b07}
.mk-ink{fill:#17212b}.mk-idp{fill:#9a5b07}.mk-acc{fill:#0b6b78}.mk-warn{fill:#b42318}
.door{fill:none;stroke-width:1.6;stroke-dasharray:5 4}
.door.open{stroke:#b42318}.door.shut{stroke:#2e7a4c}
.stop{fill:#ffffff;stroke:#2e7a4c;stroke-width:2}
.stop-x{stroke:#2e7a4c;stroke-width:2}
.door-t{font-size:11px}.open-t{fill:#b42318}.shut-t{fill:#2e7a4c}
.num{fill:#0b6b78}
.num-t{fill:#ffffff;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600}
</style><rect width="1080" height="396" class="bg"/><g transform="translate(10,0)"><text x="10" y="24" class="head">static</text><text x="10" y="42" class="head-s">default</text><g transform="translate(0,52)">
<defs><marker id="a-static" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-ink"/></marker><marker id="w-static" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-warn"/></marker><marker id="x-static" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-idp"/></marker></defs>
<rect x="30" y="16" width="110" height="38" rx="6" class="box"/>
<text x="85" y="40" class="t lbl" text-anchor="middle">Alice</text>
<rect x="200" y="16" width="110" height="38" rx="6" class="box"/>
<text x="255" y="40" class="t lbl" text-anchor="middle">Bob</text>
<line x1="85" y1="54" x2="138" y2="126" class="ln" marker-end="url(#a-static)"/>
<line x1="255" y1="54" x2="202" y2="126" class="ln" marker-end="url(#a-static)"/>
<text x="104" y="96" class="m tok" text-anchor="end">alice-token</text>
<text x="236" y="96" class="m tok" text-anchor="start">bob-token</text>
<rect x="95" y="130" width="150" height="46" rx="6" class="box gw"/>
<text x="170" y="158" class="t lbl" text-anchor="middle">gateway</text>
<rect x="95" y="258" width="150" height="46" rx="6" class="box"/>
<text x="170" y="286" class="t lbl" text-anchor="middle">relay</text>
<line x1="170" y1="176" x2="170" y2="254" class="ln" marker-end="url(#a-static)"/>
<text x="180" y="212" class="m tok" text-anchor="start">gateway's token</text>
<path d="M30,35 H14 V281 H60" class="door shut"/>
<circle cx="70" cy="281" r="9" class="stop"/>
<path d="M65,276 L75,286 M75,276 L65,286" class="stop-x"/>
<text x="18" y="324" class="m door-t shut-t">side door: blocked</text>
</g></g><g transform="translate(370,0)"><text x="10" y="24" class="head">passthrough</text><text x="10" y="42" class="head-s">callers' own tokens</text><g transform="translate(0,52)">
<defs><marker id="a-passthrough" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-ink"/></marker><marker id="w-passthrough" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-warn"/></marker><marker id="x-passthrough" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-idp"/></marker></defs>
<rect x="30" y="16" width="110" height="38" rx="6" class="box"/>
<text x="85" y="40" class="t lbl" text-anchor="middle">Alice</text>
<rect x="200" y="16" width="110" height="38" rx="6" class="box"/>
<text x="255" y="40" class="t lbl" text-anchor="middle">Bob</text>
<line x1="85" y1="54" x2="138" y2="126" class="ln" marker-end="url(#a-passthrough)"/>
<line x1="255" y1="54" x2="202" y2="126" class="ln" marker-end="url(#a-passthrough)"/>
<text x="104" y="96" class="m tok" text-anchor="end">alice-token</text>
<text x="236" y="96" class="m tok" text-anchor="start">bob-token</text>
<rect x="95" y="130" width="150" height="46" rx="6" class="box gw"/>
<text x="170" y="158" class="t lbl" text-anchor="middle">gateway</text>
<rect x="95" y="258" width="150" height="46" rx="6" class="box"/>
<text x="170" y="286" class="t lbl" text-anchor="middle">relay</text>
<line x1="170" y1="176" x2="170" y2="254" class="ln" marker-end="url(#a-passthrough)"/>
<text x="180" y="212" class="m tok" text-anchor="start">alice-token</text>
<text x="180" y="227" class="m tok" text-anchor="start">or bob-token</text>
<path d="M30,35 H14 V281 H91" class="door open" marker-end="url(#w-passthrough)"/>
<text x="18" y="324" class="m door-t open-t">side door: open</text>
</g></g><g transform="translate(730,0)"><text x="10" y="24" class="head">exchange</text><text x="10" y="42" class="head-s rec">RFC 8693 · recommended with OAuth</text><g transform="translate(0,52)">
<defs><marker id="a-exchange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-ink"/></marker><marker id="w-exchange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-warn"/></marker><marker id="x-exchange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-idp"/></marker></defs>
<rect x="30" y="16" width="110" height="38" rx="6" class="box"/>
<text x="85" y="40" class="t lbl" text-anchor="middle">Alice</text>
<rect x="200" y="16" width="110" height="38" rx="6" class="box"/>
<text x="255" y="40" class="t lbl" text-anchor="middle">Bob</text>
<line x1="85" y1="54" x2="138" y2="126" class="ln" marker-end="url(#a-exchange)"/>
<line x1="255" y1="54" x2="202" y2="126" class="ln" marker-end="url(#a-exchange)"/>
<text x="104" y="96" class="m tok" text-anchor="end">alice-token</text>
<text x="236" y="96" class="m tok" text-anchor="start">bob-token</text>
<rect x="95" y="130" width="150" height="46" rx="6" class="box gw"/>
<text x="170" y="158" class="t lbl" text-anchor="middle">gateway</text>
<rect x="95" y="258" width="150" height="46" rx="6" class="box"/>
<text x="170" y="286" class="t lbl" text-anchor="middle">relay</text>
<line x1="170" y1="176" x2="170" y2="254" class="ln" marker-end="url(#a-exchange)"/>
<text x="180" y="212" class="m tok" text-anchor="start">relay token</text>
<text x="180" y="227" class="m tok" text-anchor="start">for alice / bob</text>
<rect x="262" y="130" width="70" height="46" rx="6" class="box idp"/>
<text x="297" y="158" class="t lbl" text-anchor="middle">IdP</text>
<line x1="245" y1="145" x2="258" y2="145" class="ln idpln" marker-end="url(#x-exchange)"/>
<line x1="262" y1="162" x2="249" y2="162" class="ln idpln" marker-end="url(#x-exchange)"/>
<text x="297" y="194" class="m tok" text-anchor="middle">swap</text>
<path d="M30,35 H14 V281 H60" class="door shut"/>
<circle cx="70" cy="281" r="9" class="stop"/>
<path d="M65,276 L75,286 M75,276 L65,286" class="stop-x"/>
<text x="18" y="324" class="m door-t shut-t">side door: blocked</text>
</g></g></svg>
