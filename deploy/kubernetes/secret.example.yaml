# Example Secret for the fence-gateway. Do NOT commit a real version with real
# tokens — copy it to secret.yaml, replace the placeholders with output from
# `openssl rand -hex 32`, and apply it once out-of-band.
#
# secret.yaml is deliberately NOT listed in kustomization.yaml so that
# `kubectl apply -k .` cannot roll a real secret back to these placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: fence-gateway-auth
type: Opaque
stringData:
  # Downstream client tokens. The key "tokens" becomes the filename inside the
  # mount: the Deployment mounts this Secret at /etc/gateway-auth, so the
  # gateway reads /etc/gateway-auth/tokens (MCP_AUTH_TOKEN_FILE).
  #
  # Each line is `identity:token`. Identity is any string used only for log
  # correlation; token must be at least 32 characters. Blank lines and lines
  # starting with '#' are ignored.
  tokens: |
    alice:REPLACE_ME_64_HEX_CHARS_FROM_openssl_rand_hex_32_xxxxxxxxxxxxxxxxxxxx
    bob:REPLACE_ME_64_HEX_CHARS_FROM_openssl_rand_hex_32_xxxxxxxxxxxxxxxxxxxxxx

  # The bearer token the gateway presents TO the upstream relay, referenced by
  # the UPSTREAM_MCP_TOKEN env entry in deployment.yaml. This is the relay's
  # own MCP auth token — a credential in the opposite direction from the client
  # tokens above. Delete this key (and the env entry) if the relay needs no auth.
  upstream-token: REPLACE_ME_WITH_THE_RELAYS_MCP_AUTH_TOKEN
