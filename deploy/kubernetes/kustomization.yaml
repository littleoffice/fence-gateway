apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# secret.example.yaml and ingress.example.yaml are deliberately NOT listed here:
# the Secret holds real token values that don't belong in source control, and
# the Ingress host/class/Issuer are cluster-specific. Apply your own copies
# out-of-band. See README.md for the sequence.
resources:
  - deployment.yaml
  - service.yaml

